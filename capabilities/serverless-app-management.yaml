naftiko: "1.0.0-alpha1"

info:
  label: "Amazon SAR Serverless App Management"
  description: "Unified capability for publishing, discovering, and deploying serverless applications via the AWS Serverless Application Repository. Used by Serverless Developers and Platform Engineers."
  tags:
    - Amazon Serverless Application Repository
    - Serverless
    - Lambda
    - SAM
    - DevOps
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - import: amazon-serverless-application-repository
      location: ./shared/amazon-serverless-application-repository.yaml

  exposes:
    - type: rest
      port: 8080
      namespace: serverless-app-management-api
      description: "Unified REST API for Amazon SAR serverless application lifecycle management."
      resources:
        - path: /v1/applications
          name: applications
          description: "Serverless application catalog management"
          operations:
            - method: GET
              name: list-applications
              description: "Browse the serverless application catalog"
              call: "amazon-serverless-application-repository.list-applications"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: publish-application
              description: "Publish a new serverless application"
              call: "amazon-serverless-application-repository.create-application"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/applications/{applicationId}
          name: application
          description: "Individual application management"
          operations:
            - method: GET
              name: get-application
              description: "Get application details"
              call: "amazon-serverless-application-repository.get-application"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/applications/{applicationId}/versions
          name: application-versions
          description: "Application version management"
          operations:
            - method: GET
              name: list-versions
              description: "List application versions"
              call: "amazon-serverless-application-repository.list-application-versions"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-version
              description: "Publish a new application version"
              call: "amazon-serverless-application-repository.create-application-version"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/applications/{applicationId}/deploy
          name: application-deployment
          description: "Application deployment via CloudFormation"
          operations:
            - method: POST
              name: deploy
              description: "Deploy a serverless application"
              call: "amazon-serverless-application-repository.create-changeset"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9090
      namespace: serverless-app-management-mcp
      transport: http
      description: "MCP server for AI-assisted Amazon SAR serverless application lifecycle management."
      tools:
        - name: list-applications
          description: "Browse the serverless application repository catalog"
          hints:
            readOnly: true
            idempotent: true
          call: "amazon-serverless-application-repository.list-applications"
          outputParameters:
            - type: object
              mapping: "$."
        - name: publish-application
          description: "Publish a new serverless application to the SAR"
          hints:
            readOnly: false
            idempotent: false
          call: "amazon-serverless-application-repository.create-application"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-application
          description: "Get details and metadata for a serverless application"
          hints:
            readOnly: true
            idempotent: true
          call: "amazon-serverless-application-repository.get-application"
          outputParameters:
            - type: object
              mapping: "$."
        - name: update-application
          description: "Update metadata for a published serverless application"
          hints:
            readOnly: false
            idempotent: false
          call: "amazon-serverless-application-repository.update-application"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-application-versions
          description: "List all published versions of an application"
          hints:
            readOnly: true
            idempotent: true
          call: "amazon-serverless-application-repository.list-application-versions"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-application-version
          description: "Publish a new version of an existing application"
          hints:
            readOnly: false
            idempotent: false
          call: "amazon-serverless-application-repository.create-application-version"
          outputParameters:
            - type: object
              mapping: "$."
        - name: deploy-application
          description: "Deploy a serverless application to your AWS account"
          hints:
            readOnly: false
            idempotent: false
          call: "amazon-serverless-application-repository.create-changeset"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-application-policy
          description: "Get the sharing policy for a published application"
          hints:
            readOnly: true
            idempotent: true
          call: "amazon-serverless-application-repository.get-application-policy"
          outputParameters:
            - type: object
              mapping: "$."
