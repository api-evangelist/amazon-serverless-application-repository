naftiko: "1.0.0-alpha1"

info:
  label: "Amazon Serverless Application Repository API"
  description: "API for creating, managing, and deploying serverless applications via the AWS Serverless Application Repository."
  tags:
    - Amazon Serverless Application Repository
    - Serverless
    - Lambda
    - SAM
    - AWS
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - type: http
      namespace: amazon-serverless-application-repository
      baseUri: https://serverlessrepo.us-east-1.amazonaws.com
      description: "Amazon Serverless Application Repository REST API"
      authentication:
        type: apikey
        key: Authorization
        value: "AWS4-HMAC-SHA256 Credential={{AWS_ACCESS_KEY_ID}}"
        placement: header
      resources:
        - name: applications
          path: /applications
          description: "Application management operations"
          operations:
            - name: list-applications
              method: GET
              description: "Lists applications owned by the requester"
              inputParameters:
                - name: maxItems
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of items to return"
                - name: nextToken
                  in: query
                  type: string
                  required: false
                  description: "Pagination token"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-application
              method: POST
              description: "Creates an application"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-application
              method: GET
              description: "Gets the specified application"
              inputParameters:
                - name: applicationId
                  in: path
                  type: string
                  required: true
                  description: "The application ARN"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-application
              method: PATCH
              description: "Updates the specified application"
              inputParameters:
                - name: applicationId
                  in: path
                  type: string
                  required: true
                  description: "The application ARN"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-application
              method: DELETE
              description: "Deletes the specified application"
              inputParameters:
                - name: applicationId
                  in: path
                  type: string
                  required: true
                  description: "The application ARN"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-application-version
              method: POST
              description: "Creates an application version"
              inputParameters:
                - name: applicationId
                  in: path
                  type: string
                  required: true
                  description: "The application ARN"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-application-versions
              method: GET
              description: "Lists versions for the specified application"
              inputParameters:
                - name: applicationId
                  in: path
                  type: string
                  required: true
                  description: "The application ARN"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-changeset
              method: POST
              description: "Creates an AWS CloudFormation change set for the given application"
              inputParameters:
                - name: applicationId
                  in: path
                  type: string
                  required: true
                  description: "The application ARN"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-application-policy
              method: GET
              description: "Retrieves the policy for the application"
              inputParameters:
                - name: applicationId
                  in: path
                  type: string
                  required: true
                  description: "The application ARN"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: put-application-policy
              method: PUT
              description: "Sets the permission policy for an application"
              inputParameters:
                - name: applicationId
                  in: path
                  type: string
                  required: true
                  description: "The application ARN"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: amazon-sar-rest
      resources:
        - path: /v1/applications
          name: applications
          description: "Serverless application management"
          operations:
            - method: GET
              name: list-applications
              description: "List serverless applications"
              call: "amazon-serverless-application-repository.list-applications"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-application
              description: "Create a serverless application"
              call: "amazon-serverless-application-repository.create-application"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: amazon-sar-mcp
      transport: http
      tools:
        - name: list-applications
          description: "List serverless applications in the SAR"
          hints:
            readOnly: true
            idempotent: true
          call: "amazon-serverless-application-repository.list-applications"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-application
          description: "Publish a new serverless application"
          hints:
            readOnly: false
            idempotent: false
          call: "amazon-serverless-application-repository.create-application"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-application
          description: "Get details of a serverless application"
          hints:
            readOnly: true
            idempotent: true
          call: "amazon-serverless-application-repository.get-application"
          outputParameters:
            - type: object
              mapping: "$."
        - name: deploy-application
          description: "Deploy a serverless application via CloudFormation change set"
          hints:
            readOnly: false
            idempotent: false
          call: "amazon-serverless-application-repository.create-changeset"
          outputParameters:
            - type: object
              mapping: "$."
