aid: amazon-serverless-application-repository
name: Amazon Serverless Application Repository
description: >-
  The AWS Serverless Application Repository enables teams, organizations, and
  individual developers to find, deploy, and publish serverless applications.
  It enables you to quickly deploy code samples, components, and complete
  applications for common use cases such as web and mobile backends.
